<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포격 대전</title>
  <meta name="description" content="로봇 5종으로 즐기는 2D 포격 대전 게임">
  <link rel="icon" href="TemplateData/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <meta property="og:title" content="포격 대전">
  <meta property="og:description" content="로봇 5종으로 즐기는 2D 포격 대전 게임">
  <meta property="og:image" content="TemplateData/icon-robots.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #141a33;
      --bg-bottom: #2b1b2e;
      --ink: #f4f1ea;
      --ink-dim: #b8b3c7;
      --accent: #ff8a3d;
      --accent-dark: #d9621a;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-line: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--ink);
      font-family: "Noto Sans KR", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ---------- start screen ---------- */
    #start {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px 16px;
      text-align: center;
      overflow-y: auto;
    }
    #stars { position: fixed; inset: 0; pointer-events: none; }
    h1 {
      margin: 0;
      font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
      font-weight: 400;
      font-size: clamp(48px, 9vw, 96px);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--ink);
      text-shadow: 0 4px 0 var(--accent-dark), 0 10px 24px rgba(0, 0, 0, 0.45);
    }
    .tagline { margin: 0; color: var(--ink-dim); font-size: clamp(14px, 2vw, 18px); }

    #play {
      appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
      color: inherit; font: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      transition: transform 0.18s ease;
      position: relative; z-index: 1;
    }
    #play img {
      width: min(760px, 92vw); height: auto; display: block;
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.5));
      transition: filter 0.18s ease;
    }
    #play:hover { transform: translateY(-6px); }
    #play:hover img { filter: drop-shadow(0 20px 22px rgba(0, 0, 0, 0.55)) brightness(1.06); }
    #play:active { transform: translateY(-2px) scale(0.99); }
    #play:focus-visible { outline: 3px solid var(--accent); outline-offset: 8px; border-radius: 16px; }
    .play-label {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 40px;
      border-radius: 999px;
      background: var(--accent);
      color: #2a1406;
      font-weight: 700; font-size: 22px;
      box-shadow: 0 5px 0 var(--accent-dark), 0 10px 20px rgba(0, 0, 0, 0.35);
    }
    #play:hover .play-label { background: #ff9a55; }

    .help {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px;
      margin: 4px 0 0; padding: 12px 18px;
      background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
      color: var(--ink-dim); font-size: 14px;
      position: relative; z-index: 1;
    }
    kbd {
      display: inline-block; min-width: 1.8em; padding: 1px 6px; margin-right: 2px;
      border: 1px solid var(--panel-line); border-bottom-width: 2px; border-radius: 5px;
      background: rgba(255, 255, 255, 0.08); color: var(--ink);
      font-family: inherit; font-size: 13px; text-align: center;
    }
    #mobile-note {
      display: none; margin: 0; max-width: 420px;
      color: #ffd2b0; font-size: 14px;
    }
    .is-mobile #mobile-note { display: block; }

    /* ---------- game ---------- */
    #game { position: fixed; inset: 0; display: none; background: #000; }
    #game.on { display: block; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }
    #loading .title { font-family: "Black Han Sans", sans-serif; font-size: 40px; }
    .bar { width: min(420px, 80vw); height: 14px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
    #pct { color: var(--ink-dim); font-size: 14px; font-variant-numeric: tabular-nums; }
    #error { display: none; max-width: 520px; padding: 0 16px; color: #ffb4a8; text-align: center; line-height: 1.6; }
    #fs {
      position: absolute; right: 12px; bottom: 12px; display: none;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--panel-line);
      background: rgba(0, 0, 0, 0.45); color: var(--ink); font: 13px "Noto Sans KR", sans-serif; cursor: pointer;
    }
    #fs:hover { background: rgba(0, 0, 0, 0.7); }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main id="start">
    <h1>포격 대전</h1>
    <p class="tagline">각도와 파워를 맞추고, 땅을 부숴서 상대를 떨어뜨려라!</p>

    <button id="play" type="button" aria-label="포격 대전 게임 시작">
      <img src="TemplateData/icon-robots.png" alt="엠버, 와트, 프로스트, 드릴로, 스플릿 — 로봇 5종">
      <span class="play-label">▶ 게임 시작</span>
    </button>

    <div class="help">
      <span><kbd>←</kbd><kbd>→</kbd> 각도</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> 파워</span>
      <span><kbd>A</kbd><kbd>D</kbd> 이동</span>
      <span><kbd>W</kbd> 점프</span>
      <span><kbd>Space</kbd> 발사</span>
      <span><kbd>E</kbd> 아이템</span>
    </div>
    <p id="mobile-note">키보드로 조작하는 게임이라 PC 브라우저에서 플레이해 주세요.</p>
  </main>

  <div id="game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">포격 대전</div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="pct">게임을 불러오는 중… 0%</div>
      <div id="error"></div>
    </div>
    <button id="fs" type="button">전체 화면</button>
  </div>

  <script>
    // Simple twinkling starfield behind the start screen
    (function () {
      const c = document.getElementById('stars');
      const ctx = c.getContext('2d');
      let stars = [];
      function resize() {
        c.width = innerWidth * devicePixelRatio;
        c.height = innerHeight * devicePixelRatio;
        stars = Array.from({ length: 140 }, () => ({
          x: Math.random() * c.width, y: Math.random() * c.height * 0.85,
          r: (Math.random() * 1.3 + 0.3) * devicePixelRatio, p: Math.random() * Math.PI * 2
        }));
      }
      let running = true;
      function draw(t) {
        if (!running) return;
        ctx.clearRect(0, 0, c.width, c.height);
        for (const s of stars) {
          ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t / 900 + s.p);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', resize);
      resize(); requestAnimationFrame(draw);
      window.stopStars = () => { running = false; c.style.display = 'none'; };
    })();

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) document.body.classList.add('is-mobile');

    const config = {
      arguments: [],
      dataUrl: "Build/WebRelease.data.unityweb",
      frameworkUrl: "Build/WebRelease.framework.js.unityweb",
      codeUrl: "Build/WebRelease.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "포격 대전",
      productVersion: "1.0",
      showBanner: (msg, type) => { if (type === 'error') showError(msg); else console.warn(msg); },
    };

    function showError(msg) {
      const e = document.getElementById('error');
      e.style.display = 'block';
      e.textContent = '게임을 불러오지 못했어요. 새로고침하거나 최신 Chrome/Edge 브라우저로 다시 시도해 주세요. (' + msg + ')';
    }

    let started = false;
    document.getElementById('play').addEventListener('click', () => {
      if (started) return;
      started = true;
      document.getElementById('start').style.display = 'none';
      window.stopStars();
      document.getElementById('game').classList.add('on');

      const fill = document.getElementById('bar-fill');
      const pct = document.getElementById('pct');
      const script = document.createElement('script');
      script.src = "Build/WebRelease.loader.js";
      script.onerror = () => showError('loader');
      script.onload = () => {
        createUnityInstance(document.getElementById('unity-canvas'), config, (p) => {
          fill.style.width = (p * 100) + '%';
          pct.textContent = '게임을 불러오는 중… ' + Math.round(p * 100) + '%';
        }).then((unity) => {
          document.getElementById('loading').style.display = 'none';
          const fs = document.getElementById('fs');
          fs.style.display = 'block';
          fs.onclick = () => unity.SetFullscreen(1);
          document.getElementById('unity-canvas').focus();
        }).catch(showError);
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
